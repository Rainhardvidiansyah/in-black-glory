events {}

http {
  resolver 127.0.0.11 valid=10s; 

  server {
    listen 80;

    location / {
      set $upstream_app ibg-app:3000;  
      proxy_pass http://$upstream_app;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}