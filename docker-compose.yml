services:

  nginx:
   image: nginx:alpine
   container_name: nginx-in-black-glory
   ports:
     - 80:80
   volumes:
     - ./nginx/nginx.conf:/etc/nginx/nginx.conf
   depends_on:
    - ibg-app

  ibg-app:
    build: .
    image: nest-app:latest
    # container_name: nest-app
    # ports:
    #   - "3000:3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
    deploy:
      replicas: 3

  postgres:
    image: postgres:15-alpine
    container_name: postgres-in-black-glory
    ports:
      - "5432:5432"
    environment:
      # POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_DB: ${DATABASE_NAME}
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis-in-black-glory
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailpit:
   image: axllent/mailpit:latest
   container_name: mailpit-in-black-glory
   ports:
    - "8026:8025"  # UI dashboard
    - "1026:1025"  # SMTP port
    
volumes:
  postgres_data: